name: Build Windows EXE

on:
  push:
    branches: [ main ] # Запуск при изменении в ветке main
  workflow_dispatch:   # Позволяет запустить сборку вручную

jobs:
  build-windows:
    runs-on: windows-latest # Самое важное: сборка идёт на Windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Создаст черновик релиза и прикрепит туда .exe
          tagName: app-v__VERSION__
          releaseName: 'AP_Babilon v__VERSION__'
          releaseDraft: true

          # Добавьте эти три строки:
          appName: "AP_Babilon"
          appVersion: "1.0.0"
          distPath: "."
          identifier: "com.babilon.monitor"
