name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@v1

      - name: Initialize Tauri project
        # Здесь мы явно говорим Tauri: "Возьми index.html из текущей папки, назови приложение AP_Babilon и используй этот уникальный ID"
        run: tauri init --ci --app-name "AP_Babilon" --window-title "AP_Babilon" --frontend-dist "../" --dev-path "../" --identifier "com.babilon.monitor"

      - name: Add hosts.json to Tauri resources
        # Добавляем hosts.json в конфиг, чтобы он попал в итоговый EXE
        run: |
          $json = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $json.tauri.bundle.resources = @("../../hosts.json")
          $json | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'AP_Babilon v__VERSION__'
          releaseDraft: true
          # Важно: указываем, что сборку уже инициализировали, чтобы экшен не перезаписывал конфиг
          tauriScript: "npx tauri"
